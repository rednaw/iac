# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  USERNAME:
    sh: whoami
  HOME:
    sh: echo $HOME
  SOPS_CONFIG_DIR: '{{.HOME}}/.config/sops/age'
  SOPS_KEY_FILE: '{{.SOPS_CONFIG_DIR}}/keys.txt'

includes:
  hostkeys: tasks/Taskfile.hostkeys.yml
  _terraform: tasks/Taskfile._terraform.yml
  _ansible: tasks/Taskfile._ansible.yml
  platform: tasks/Taskfile.platform.yml
  vpn: tasks/Taskfile.vpn.yml
  secrets: tasks/Taskfile.secrets.yml
  workflow: tasks/Taskfile.workflow.yml
  server: tasks/Taskfile.server.yml
  tunnel: tasks/Taskfile.tunnel.yml
  backup: tasks/Taskfile.backup.yml
  test: tasks/Taskfile.test.yml
  registry: tasks/Taskfile.registry.yml
  app: tasks/Taskfile.app.yml

tasks:
  default:
    desc: Show available commands
    cmds:
      - task: help

  help:
    desc: Show help message
    silent: true
    cmds:
      - |
        echo "Infrastructure as Code"
        echo ""
        echo "Platform — Provision (Terraform: cloud server, firewall, DNS):"
        echo "  task platform:provision:plan|apply|destroy|output"
        echo "  task platform:provision:reconfigure"
        echo ""
        echo "Platform — Configure (Ansible):"
        echo "  task platform:configure:bootstrap   # One-time as root"
        echo "  task platform:configure:apply"
        echo ""
        echo "VPN — travel VPN box (docs/future/vpn-travel-china-manual.md):"
        echo "  task vpn:provision:plan|apply|destroy|output"
        echo "  task vpn:provision:renew-ip"
        echo "  task vpn:configure:bootstrap|apply"
        echo "  task vpn:config"
        echo ""
        echo "Host keys / travel SSH:"
        echo "  task hostkeys:accept -- platform|vpn"
        echo "  task ssh-allow-me"
        echo "  task ssh-revoke-me"
        echo ""
        echo "Workflow (Prefect):"
        echo "  task workflow:deploy"
        echo ""
        echo "Application:"
        echo "  task app:deploy   -- <app> <sha>"
        echo "  task app:versions -- <app>"
        echo ""
        echo "Testing:"
        echo "  task test:run"
        echo ""
        echo "SSH Tunnel (admin UIs):"
        echo "  task tunnel:start"
        echo "  task tunnel:stop"
        echo "  # landing page: portal.html (open in host browser after start)"
        echo ""
        echo "Secrets (SOPS):"
        echo "  task secrets:keygen"
        echo "  task secrets:generate-sops-config"
        echo "  task secrets:generate-app-env-sops-config -- <app>"
        echo "  task secrets:sync-all-app-env-sops-configs"
        echo ""
        echo "Registry:"
        echo "  task registry:overview"
        echo ""
        echo "Utilities:"
        echo "  task server:check-status"
        echo "  task server:list-hetzner-keys"
        echo ""
        echo "Backups (Restic, per app):"
        echo "  task backup:snapshots -- <app>"
        echo "  task backup:restore   -- <app> [snap] [...]"
        echo "  task backup:download  -- <app>"
        echo "  task backup:upload    -- <app>"

  ssh-allow-me:
    desc: "Travel only: allow current public IPv4 /32 (TCP/22) on every iac firewall (skip at home)"
    silent: true
    cmds:
      - ./scripts/ssh-allow-me.sh

  ssh-revoke-me:
    desc: "Remove all ssh-allow-me travel rules (home rules untouched)"
    silent: true
    cmds:
      - ./scripts/ssh-revoke-me.sh

  _check:sops-key:
    desc: "(internal) Ensure SOPS key exists"
    internal: true
    preconditions:
      - sh: test -f "{{.SOPS_KEY_FILE}}"
        msg: "SOPS key file not found. Run 'task secrets:keygen' first."

  _check:app:
    desc: "(internal) Validate APP arg resolves to /workspaces/<name>/.iac/ contract"
    internal: true
    requires:
      vars: [APP]
    preconditions:
      - sh: '[ -n "{{.APP}}" ]'
        msg: "App name required."
      - sh: '[ "{{.APP}}" != "iac" ]'
        msg: "APP cannot be 'iac' (that is this repo). Use the sibling clone basename under /workspaces/<app>."
      - sh: test -d "/workspaces/{{.APP}}"
        msg: "App not found at /workspaces/{{.APP}}. Clone the app as a sibling of iac/ on the host (same parent), rebuild the container, then retry."
      - sh: test -f "/workspaces/{{.APP}}/.iac/iac.yml"
        msg: "App missing /workspaces/{{.APP}}/.iac/iac.yml. Create the .iac/ contract under the sibling app clone."
