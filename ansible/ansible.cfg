[defaults]
roles_path = roles:ansible/roles
remote_user = ubuntu
interpreter_python = /usr/bin/python3
remote_tmp = /tmp/.ansible-${USER}
host_key_checking = True
retry_files_enabled = False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600
stdout_callback = unixy
display_ok_hosts = False
display_skipped_hosts = False
deprecation_warnings=False

[inventory]
enable_plugins = host_list, script, auto, yaml, ini, toml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# StrictHostKeyChecking=yes: ansible_host is always the API IPv4; the key is
# recorded by `task hostkeys:accept` after every (re)create. Never accept-new
# here — that would silently trust any box on first contact.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes -o ConnectTimeout=10
pipelining = True
