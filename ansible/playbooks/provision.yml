---
# Cloud provision for one box (server + primary IPv4 + firewall) via hetzner.hcloud,
# plus TransIP DNS for platform. Token and ssh_keys come only from secrets_file
# (never an ambient HCLOUD_TOKEN).
#
#   ansible-playbook -i localhost, playbooks/provision.yml -e box=vpn|platform -e secrets_file=… [-e state=absent]
#
# absent leaves DNS records in place.

- name: Provision cloud box
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  pre_tasks:
    - name: Decrypt and load secrets
      ansible.builtin.import_tasks: ../tasks/secrets.yml

    - name: Require hcloud_token in secrets
      ansible.builtin.assert:
        that: infrastructure_secrets.hcloud_token | default('') | length > 0
        fail_msg: "hcloud_token missing from {{ _secrets_file }}"
        quiet: true

  module_defaults:
    group/hetzner.hcloud.all:
      api_token: "{{ infrastructure_secrets.hcloud_token }}"

  roles:
    - role: hcloud_box
      vars:
        hcloud_box_name: "{{ box }}"
        hcloud_box_profile: "{{ 'platform' if box == 'platform' else 'reality' }}"
        hcloud_box_state: "{{ state | default('present') }}"
        hcloud_box_ssh_keys: "{{ infrastructure_secrets.ssh_keys | default([]) }}"
        hcloud_box_api_token: "{{ infrastructure_secrets.hcloud_token }}"

    - role: platform_dns
      when: box == 'platform' and state | default('present') == 'present'

  post_tasks:
    - name: Write outcome for the Task wrapper
      ansible.builtin.copy:
        content: "{{ hcloud_box_summary }}\n"
        dest: "{{ lookup('env', 'HCLOUD_BOX_SUMMARY_FILE') }}"
        mode: "0600"
      changed_when: false
      check_mode: false
      when: lookup('env', 'HCLOUD_BOX_SUMMARY_FILE') | length > 0
