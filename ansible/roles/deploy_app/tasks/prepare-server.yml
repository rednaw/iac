---
# Prepare server for application deployment
#
# Creates deploy directory, copies files
#
# Inputs:
#   deploy_target: Target path on server
#   app_root: Path to app directory (contract under .iac/)
#   image_digest: Full image reference with digest
#   app_secrets_file: Stat result for .env
#   decrypted_app_secrets: Decrypted secrets content

- name: Ensure deploy directory exists
  ansible.builtin.file:
    path: "{{ deploy_target }}"
    state: directory
    owner: iac
    group: iac
    mode: '0755'

- name: Copy app secrets to .env
  ansible.builtin.copy:
    content: "{{ decrypted_app_secrets.stdout }}"
    dest: "{{ deploy_target }}/.env"
    owner: iac
    group: iac
    mode: '0600'
  when: app_secrets_file.stat.exists
  no_log: true

- name: Load app iac.yml
  ansible.builtin.include_vars:
    file: "{{ app_root }}/.iac/iac.yml"
    name: app_iac
  delegate_to: localhost

- name: Select APP_HOST (first app_domains entry)
  ansible.builtin.set_fact:
    app_host: "{{ (app_iac.app_domains | default([])) | first | default('') }}"

- name: Assert APP_HOST is set
  ansible.builtin.assert:
    that: app_host | length > 0
    fail_msg: >-
      app_domains in {{ app_root }}/.iac/iac.yml is empty.
      Traefik Host() needs the canonical hostname as the first entry.

- name: Set IMAGE in .env
  ansible.builtin.lineinfile:
    path: "{{ deploy_target }}/.env"
    line: "IMAGE={{ image_digest }}"
    regexp: '^IMAGE='
    owner: iac
    group: iac
    mode: '0600'
    create: true

- name: Set APP_HOST in .env
  ansible.builtin.lineinfile:
    path: "{{ deploy_target }}/.env"
    line: "APP_HOST={{ app_host }}"
    regexp: '^APP_HOST='
    owner: iac
    group: iac
    mode: '0600'
    create: true

- name: Copy docker-compose.yml from app contract
  ansible.builtin.copy:
    src: "{{ app_root }}/.iac/docker-compose.yml"
    dest: "{{ deploy_target }}/docker-compose.yml"
    owner: iac
    group: iac
    mode: '0644'

- name: Stat app backup.yml (optional contract file)
  ansible.builtin.stat:
    path: "{{ app_root }}/.iac/backup.yml"
  register: app_backup_yml_stat
  delegate_to: localhost

- name: Copy backup.yml to server when present in app
  ansible.builtin.copy:
    src: "{{ app_root }}/.iac/backup.yml"
    dest: "{{ deploy_target }}/backup.yml"
    owner: iac
    group: iac
    mode: '0644'
  when: app_backup_yml_stat.stat.exists
