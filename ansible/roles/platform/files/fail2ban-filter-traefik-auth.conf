# Fail2ban filter: Traefik access log – generic 401|403
# Used by jail traefik-auth. Log format: common (NCSA).
#
# Each ignoreregex is a separate compiled pattern (one <HOST> each).
# Do not OR two <HOST> alternatives in a single pattern — fail2ban expands
# <HOST> to named groups and Python rejects duplicate names.

[Definition]
failregex = ^<HOST> -.*"(GET|POST).*HTTP.*" (401|403) .*$
# Registry probes: path /v2/ or router name registry@docker (Traefik common log).
ignoreregex = ^<HOST> -.*"/v2/.*" (401|403) .*$
              ^<HOST> -.*registry@docker.*(401|403).*$
