---
# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/ansible.json#/$defs/tasks
# Traefik: reverse proxy, TLS (ACME), dashboard
# Runs after Docker, before registry (so /etc/traefik/auth exists for htpasswd).

- name: Assert base_domain is set in infrastructure secrets
  ansible.builtin.assert:
    that: infrastructure_secrets.base_domain is defined and infrastructure_secrets.base_domain | length > 0
    fail_msg: "'base_domain' is missing from ../secrets/infra.yml. Set it to your domain (e.g. example.com)."

- name: Set Traefik facts (base_domain, site_domain)
  ansible.builtin.set_fact:
    base_domain: "{{ infrastructure_secrets.base_domain }}"
    site_domain: "{{ infrastructure_secrets.app_domain | default(infrastructure_secrets.base_domain, true) }}"

- name: Create Traefik directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/traefik
    - /etc/traefik/dynamic
    - /etc/traefik/certs
    - /etc/traefik/auth
    - /var/log/traefik

- name: Deploy Traefik static config
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: /etc/traefik/traefik.yml
    mode: '0644'
  notify: Restart Traefik

- name: Deploy Traefik dynamic redirects (www → apex)
  ansible.builtin.template:
    src: traefik-dynamic-redirects.yml.j2
    dest: /etc/traefik/dynamic/redirects.yml
    mode: '0644'

- name: Deploy Traefik HTTP→HTTPS redirect (low priority so ACME works on :80)
  ansible.builtin.template:
    src: traefik-dynamic-redirects-http.yml.j2
    dest: /etc/traefik/dynamic/redirects-http.yml
    mode: '0644'

- name: Deploy logrotate config for Traefik logs
  ansible.builtin.copy:
    src: logrotate-traefik
    dest: /etc/logrotate.d/traefik
    mode: '0644'
    owner: root
    group: root

- name: Remove stale Traefik app-host router
  ansible.builtin.file:
    path: /etc/traefik/dynamic/app-host.yml
    state: absent

- name: Deploy Traefik middlewares (app-headers, app-buffering)
  ansible.builtin.template:
    src: traefik-dynamic-middlewares.yml.j2
    dest: /etc/traefik/dynamic/middlewares.yml
    mode: '0644'

# IPv6 clients keep their source address only when the network Traefik publishes on is dual-stack.
# Otherwise docker-proxy relays them and every IPv6 visitor appears as the bridge gateway.
- name: Read Docker server version
  ansible.builtin.command:
    cmd: docker version --format {% raw %}'{{.Server.Version}}'{% endraw %}
  register: _docker_server_version
  changed_when: false

- name: Assert Docker supports per-network IPv6 port publishing
  ansible.builtin.assert:
    that: _docker_server_version.stdout is version('28.0', '>=')
    fail_msg: "Docker {{ _docker_server_version.stdout }} < 28: ip6tables / IPv6 gateway selection not guaranteed."
    quiet: true

# Docker enables IPv6 forwarding for dual-stack bridges; with forwarding on, the kernel ignores router adverts.
- name: Read host IPv6 default route
  ansible.builtin.command:
    cmd: ip -6 route show default
  register: _ipv6_default_route
  changed_when: false

- name: Assert host IPv6 default route is not learned from router adverts
  ansible.builtin.assert:
    that: "'proto ra' not in _ipv6_default_route.stdout"
    fail_msg: "IPv6 default route is RA-learned ({{ _ipv6_default_route.stdout }}); make it static before enabling Docker IPv6."
    quiet: true

- name: Read containers attached to the Traefik network
  community.docker.docker_network_info:
    name: traefik
  register: _traefik_network_info

# Enabling IPv6 recreates the network (the module disconnects everything first); reattach what was there,
# notably Compose app containers that nothing else in this play reconnects.
- name: Ensure Traefik Docker network exists (dual-stack)
  community.docker.docker_network:
    name: traefik
    state: present
    enable_ipv6: true
    ipam_config:
      - subnet: "fd4e:6b2a:9c1d:1::/64"
    connected: >-
      {{ (_traefik_network_info.network.Containers | default({}, true)).values() | map(attribute='Name') | list
         if _traefik_network_info.exists else [] }}
    appends: true

- name: Ensure OpenObserve network exists (for Traefik metrics scraping)
  community.docker.docker_network:
    name: openobserve-network
    state: present

- name: Ensure Traefik container is running
  community.docker.docker_container:
    name: traefik
    image: traefik:v3.7.10
    state: started
    restart_policy: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "[::]:80:80"
      - "0.0.0.0:443:443"
      - "[::]:443:443"
      - "127.0.0.1:57801:8080"
      - "[::1]:57801:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/traefik:/etc/traefik:ro
      - /etc/traefik/certs:/etc/traefik/certs
      - /var/log/traefik:/var/log/traefik
      - /etc/traefik/auth:/etc/traefik/auth:ro
    log_driver: json-file
    log_options:
      max-size: "10m"
      max-file: "3"
    networks:
      - name: traefik
      - name: openobserve-network
    command:
      - --configFile=/etc/traefik/traefik.yml
