---
# Xray image pin lives next to the container task (ansible/roles/vpn/tasks/xray.yml),
# same pattern as Traefik/Umami — Renovate ansible manager + no automerge.

vpn_xray_config_dir: /etc/xray

# Usage metering: byte totals of authenticated users only (no IPs, no
# destinations). API is loopback-only; the timer appends one line per hour.
vpn_xray_api_port: 10085
vpn_xray_stats_user: shared
vpn_usage_log: /var/log/xray-usage.log

# Held so nothing bounces dockerd (and with it Xray) during the travel window.
# Belt-and-braces: unattended-upgrades Allowed-Origins is Ubuntu-only, so
# download.docker.com packages are never auto-upgraded anyway.
vpn_held_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
