vpn_xray_config_dir: /etc/xray

# Held so nothing bounces dockerd (and with it Xray) during the travel window.
# Belt-and-braces: unattended-upgrades Allowed-Origins is Ubuntu-only, so
# download.docker.com packages are never auto-upgraded anyway.
vpn_held_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
