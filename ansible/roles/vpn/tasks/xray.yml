---
- name: Assert VPN secrets are present
  ansible.builtin.assert:
    that:
      - infrastructure_secrets.vpn_uuid is defined and infrastructure_secrets.vpn_uuid | length > 0
      - infrastructure_secrets.vpn_reality_private_key is defined and infrastructure_secrets.vpn_reality_private_key | length > 0
      - infrastructure_secrets.vpn_short_id is defined and infrastructure_secrets.vpn_short_id | length > 0
      - infrastructure_secrets.vpn_dest is defined and infrastructure_secrets.vpn_dest | length > 0
    fail_msg: >-
      vpn_uuid / vpn_reality_private_key / vpn_short_id / vpn_dest missing from
      secrets/infra.yml — generate them once (manual §2.1); they persist across recreates.
    quiet: true

- name: Create Xray config directory
  ansible.builtin.file:
    path: "{{ vpn_xray_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Deploy Xray config (REALITY inbound on 443)
  ansible.builtin.template:
    src: xray-config.json.j2
    dest: "{{ vpn_xray_config_dir }}/config.json"
    owner: root
    group: root
    mode: '0600'
  no_log: true # contains the REALITY private key
  notify: Restart Xray

- name: Ensure Xray container is running (host network, pinned digest)
  community.docker.docker_container:
    name: xray
    image: "{{ vpn_xray_image }}"
    state: started
    restart_policy: unless-stopped
    network_mode: host # bridge cannot egress IPv6; host keeps the box dual-stack
    # The image defaults to uid 65532, which cannot bind :443 on the host
    # network (no ambient CAP_NET_BIND_SERVICE for non-root, and network
    # sysctls are unavailable with network_mode host). Run as root instead.
    user: "0:0"
    # Image entrypoint: /usr/local/bin/xray -confdir /usr/local/etc/xray/
    volumes:
      - "{{ vpn_xray_config_dir }}:/usr/local/etc/xray:ro"
    log_driver: json-file
    log_options:
      max-size: "10m"
      max-file: "3"
