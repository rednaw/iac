# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Internal Ansible tasks. Not callable from CLI; called by purpose namespaces
# (e.g. platform:configure:apply -> _ansible:run).
#
# Parameters consumers pass:
#   PURPOSE    Server purpose ("platform", "vpn")
#   WORKSPACE  Environment (e.g. "dev", "prod"; vpn is always "prod")
#   PLAYBOOK   Playbook path relative to ansible/ (e.g. "playbooks/server.yml")
#
# Tasks run from ansible/. Inventory name: platform "<base_domain_prefix>-<workspace>"
# (e.g. rednaw-dev, resolved via hostkeys:platform); vpn just "vpn" (own fact cache).
# ansible_host is always the API IPv4 (hostkeys:ip), never a DNS hostname —
# ansible.cfg pins StrictHostKeyChecking=yes, so run hostkeys:accept once after
# a (re)create before bootstrap/run.
version: '3'

tasks:
  install:
    desc: "(internal) Install Ansible collections"
    internal: true
    dir: ansible
    silent: true
    cmds:
      - echo "📦 Installing Ansible collections..."
      - ansible-galaxy collection install -r requirements.yml

  bootstrap:
    desc: "(internal) Bootstrap server as root"
    internal: true
    dir: ansible
    silent: true
    cmds:
      - task: install
      - |
        echo "NOTE: This step connects as root using your Hetzner SSH key to set up the ubuntu user."
        IP=$(task hostkeys:ip -- "{{.PURPOSE}}" "{{.WORKSPACE}}") || exit 1
        if [ "{{.PURPOSE}}" = "vpn" ]; then INVENTORY="vpn"; else INVENTORY="$(task hostkeys:platform)-{{.WORKSPACE}}"; fi
        ansible-playbook -i "${INVENTORY}," "{{.PLAYBOOK}}" -e "ansible_host=${IP}"

  run:
    desc: "(internal) Run Ansible playbook"
    internal: true
    dir: ansible
    silent: true
    cmds:
      - task: install
      - |
        echo "⚙️  Running Ansible playbook for workspace: {{.WORKSPACE}}..."
        IP=$(task hostkeys:ip -- "{{.PURPOSE}}" "{{.WORKSPACE}}") || exit 1
        if [ "{{.PURPOSE}}" = "vpn" ]; then INVENTORY="vpn"; else INVENTORY="$(task hostkeys:platform)-{{.WORKSPACE}}"; fi
        ansible-playbook -i "${INVENTORY}," "{{.PLAYBOOK}}" -e "ansible_host=${IP}"
