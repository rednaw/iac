# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Internal Terraform tasks. Not callable from CLI; called by purpose namespaces
# (e.g. platform:provision:plan -> _terraform:plan).
#
# Parameters consumers pass:
#   TF_DIR          Terraform root directory (e.g. "terraform/platform")
#   PURPOSE         Server purpose (e.g. "platform", "vpn") — hostkeys handling
#   SECRETS_SCRIPT  Sourceable script that exports TF_VAR_* (pass a literal path;
#                   do not share this name in include-level vars — Task merges
#                   them and a later include overwrites an earlier one)
#
# Each root pins a single TFC workspace by exact name in versions.tf
# (platform → "platform", vpn → "vpn"). No workspace select / TF_WORKSPACE.
#
# apply/destroy never SSH. Host keys: hostkeys:prepare is a no-op (no DNS names);
# hostkeys:accept (run by the operator after apply, and after
# ssh-allow-me when travelling) records the new key by API IPv4.
#
# Tasks run from the IaC repo root; Terraform invocations use -chdir={{.TF_DIR}}.
version: '3'

tasks:
  reconfigure:
    desc: "(internal) Reconfigure Terraform backend for a purpose"
    internal: true
    silent: true
    deps: [":_check:sops-key", ":_check:secrets"]
    cmds:
      - |
        TFC_ORG=$(SOPS_AGE_KEY_FILE="{{.SOPS_KEY_FILE}}" sops -d "{{.SECRETS_INFRA}}" | yq -r '.terraform_cloud_organization')
        if [ -z "${TFC_ORG}" ] || [ "${TFC_ORG}" = "null" ]; then
          echo "❌ terraform_cloud_organization missing from {{.SECRETS_INFRA}}" >&2
          exit 1
        fi
        echo "🔁 Reconfiguring Terraform backend for {{.TF_DIR}} (org: ${TFC_ORG})..."
        unset TF_WORKSPACE || true
        rm -f "{{.TF_DIR}}/.terraform/environment"
        terraform -chdir="{{.TF_DIR}}" init -input=false -reconfigure -backend-config="organization=${TFC_ORG}"

  init:
    desc: "(internal) Initialize Terraform backend"
    internal: true
    silent: true
    deps: [":_check:sops-key", ":_check:secrets"]
    cmds:
      - |
        TFC_ORG=$(SOPS_AGE_KEY_FILE="{{.SOPS_KEY_FILE}}" sops -d "{{.SECRETS_INFRA}}" | yq -r '.terraform_cloud_organization')
        if [ -z "${TFC_ORG}" ] || [ "${TFC_ORG}" = "null" ]; then
          echo "❌ terraform_cloud_organization missing from {{.SECRETS_INFRA}}" >&2
          exit 1
        fi
        unset TF_WORKSPACE || true
        rm -f "{{.TF_DIR}}/.terraform/environment"
        if ! output=$(terraform -chdir="{{.TF_DIR}}" init -input=false -reconfigure -backend-config="organization=${TFC_ORG}" 2>&1); then
          echo "$output"
          echo "" >&2
          echo "If token/auth errors: refresh terraform_cloud_token in secrets, rebuild container (or re-export TF_TOKEN_app_terraform_io)." >&2
          echo "If workspace-not-found: rename the TFC workspace to match versions.tf (platform / vpn), then retry." >&2
          exit 1
        fi

  plan:
    desc: "(internal) Plan Terraform changes"
    internal: true
    silent: true
    deps: [":_check:sops-key", ":_check:secrets"]
    cmds:
      - task: init
        vars: { TF_DIR: '{{.TF_DIR}}' }
      - |
        echo "📋 Planning Terraform changes for {{.TF_DIR}}..."
        unset TF_WORKSPACE || true
        export SOPS_KEY_FILE="{{.SOPS_KEY_FILE}}"
        # shellcheck disable=SC1090
        . "./{{.SECRETS_SCRIPT}}"
        terraform -chdir="{{.TF_DIR}}" plan

  apply:
    desc: "(internal) Apply Terraform changes"
    internal: true
    silent: true
    deps: [":_check:sops-key", ":_check:secrets"]
    cmds:
      - task: init
        vars: { TF_DIR: '{{.TF_DIR}}' }
      - |
        echo "✨ Applying Terraform changes for {{.TF_DIR}}"
        unset TF_WORKSPACE || true
        export SOPS_KEY_FILE="{{.SOPS_KEY_FILE}}"
        # shellcheck disable=SC1090
        . "./{{.SECRETS_SCRIPT}}"
        echo "🔑 Removing old name-keyed host keys from known_hosts..."
        task hostkeys:prepare -- "{{.PURPOSE}}"
        terraform -chdir="{{.TF_DIR}}" apply
        echo ""
        echo "💡 If the server was (re)created: task hostkeys:accept -- {{.PURPOSE}}"
        echo "   (away from home: task ssh-allow-me first), then configure:bootstrap + configure:apply."

  destroy:
    desc: "(internal) Destroy Terraform resources"
    internal: true
    silent: true
    deps: [":_check:sops-key", ":_check:secrets"]
    cmds:
      - task: init
        vars: { TF_DIR: '{{.TF_DIR}}' }
      - |
        echo "⚠️  WARNING: This will DESTROY all resources in {{.TF_DIR}}"
        echo "Terraform will ask for confirmation..."
        echo ""
        unset TF_WORKSPACE || true
        export SOPS_KEY_FILE="{{.SOPS_KEY_FILE}}"
        # shellcheck disable=SC1090
        . "./{{.SECRETS_SCRIPT}}"
        terraform -chdir="{{.TF_DIR}}" destroy
        echo "🧹 Cleaning server host key from known_hosts..."
        task hostkeys:prepare -- "{{.PURPOSE}}"
        echo "✅ Host key removed"

  output:
    desc: "(internal) Show Terraform outputs"
    internal: true
    cmds:
      - task: init
        vars: { TF_DIR: '{{.TF_DIR}}' }
      - |
        unset TF_WORKSPACE || true
        echo "📤 Getting Terraform outputs for {{.TF_DIR}}..."
        terraform -chdir="{{.TF_DIR}}" output
