# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Application deployment tasks — run from IAC devcontainer.
# App clones are siblings at /workspaces/<name>/ (host: next to iac/).
# Each app's .iac/ directory is its platform contract:
#   /workspaces/<name>/.iac/iac.yml             — image_name, app_domains
#   /workspaces/<name>/.iac/.env                — SOPS-encrypted app secrets
#   /workspaces/<name>/.iac/docker-compose.yml — full compose for platform deploy (Traefik, services)
#
#   task app:deploy     -- <app> <sha>
#   task app:versions   -- <app>
#   task app:delete-tag -- <app> <tag>

version: '3'

vars:
  IAC_ROOT:
    sh: realpath "{{.TASKFILE_DIR}}/.."
  APPS_ROOT: /workspaces

tasks:
  deploy:
    desc: "Deploy application (use: task app:deploy -- <app> <sha>)"
    silent: true
    vars:
      APP:
        sh: echo "{{.CLI_ARGS}}" | awk '{print $1}'
      SHA:
        sh: echo "{{.CLI_ARGS}}" | awk '{print $2}'
      APP_ROOT: '{{.APPS_ROOT}}/{{.APP}}'
    preconditions:
      - sh: '[ $(echo "{{.CLI_ARGS}}" | wc -w | tr -d " ") -eq 2 ]'
        msg: "Usage: task app:deploy -- <app> <sha>"
    cmds:
      - task: ":_check:app"
        vars: { APP: '{{.APP}}' }
      - |
        for f in .iac/iac.yml .iac/.env .iac/docker-compose.yml; do
          if [ ! -f "{{.APP_ROOT}}/$f" ]; then
            echo "App missing {{.APP_ROOT}}/$f. Create the .iac/ contract (iac.yml, docker-compose.yml, .env)." >&2
            exit 1
          fi
        done

        _iac="{{.APP_ROOT}}/.iac/iac.yml"
        _forbidden_keys="base_domain app_domain hcloud_token terraform_cloud_organization terraform_cloud_token ssh_keys allowed_ssh_ips transip_account_name transip_private_key registry_username registry_password registry_http_secret openobserve_username openobserve_password abuseipdb_api_key github_oauth_client_id github_oauth_client_secret cms_oauth_allowed_domains github_oauth_hostname server_type"
        for k in $_forbidden_keys; do
          if [ "$(yq "has(\"$k\")" "$_iac")" = "true" ]; then
            echo "Forbidden infrastructure key \"$k\" in $_iac — move it to ../secrets/infra.yml (secrets sibling)." >&2
            exit 1
          fi
        done

        IMAGE_NAME=$(yq -r '.image_name' "$_iac")

        IP=$(task hostkeys:ip -- platform) || exit 1
        ANSIBLE_CONFIG="{{.IAC_ROOT}}/ansible/ansible.cfg" \
        ansible-playbook \
          -i "platform," \
          "{{.IAC_ROOT}}/ansible/playbooks/deploy-app.yml" \
          -e "ansible_host=${IP}" \
          -e "app_root={{.APP_ROOT}}" \
          -e "sha={{.SHA}}" \
          -e "registry_name=${REGISTRY}" \
          -e "image_name=$IMAGE_NAME"

  versions:
    desc: "List available versions (use: task app:versions -- <app>)"
    silent: true
    vars:
      APP:
        sh: echo "{{.CLI_ARGS}}" | awk '{print $1}'
      APP_ROOT: '{{.APPS_ROOT}}/{{.APP}}'
    preconditions:
      - sh: '[ $(echo "{{.CLI_ARGS}}" | wc -w | tr -d " ") -eq 1 ]'
        msg: "Usage: task app:versions -- <app>"
    cmds:
      - task: ":_check:app"
        vars: { APP: '{{.APP}}' }
      - |
        IMAGE_NAME=$(yq -r '.image_name' "{{.APP_ROOT}}/.iac/iac.yml")
        APP_SLUG="${IMAGE_NAME##*/}"
        cd "{{.IAC_ROOT}}" && python3 scripts/application_versions.py "$REGISTRY" "$IMAGE_NAME" "$APP_SLUG"

  delete-tag:
    desc: "Remove a tag from the app image in the registry (one-time, e.g. task app:delete-tag -- myapp latest)"
    silent: true
    vars:
      APP:
        sh: echo "{{.CLI_ARGS}}" | awk '{print $1}'
      TAG:
        sh: echo "{{.CLI_ARGS}}" | awk '{print $2}'
      APP_ROOT: '{{.APPS_ROOT}}/{{.APP}}'
    preconditions:
      - sh: '[ $(echo "{{.CLI_ARGS}}" | wc -w | tr -d " ") -eq 2 ]'
        msg: "Usage: task app:delete-tag -- <app> <tag>\nExample: task app:delete-tag -- myapp latest"
    cmds:
      - task: ":_check:app"
        vars: { APP: '{{.APP}}' }
      - |
        IMAGE_NAME=$(yq -r '.image_name' "{{.APP_ROOT}}/.iac/iac.yml")
        REF="${REGISTRY}/${IMAGE_NAME}:{{.TAG}}"
        echo "Deleting tag {{.TAG}} from registry (${REF})..."
        crane delete "$REF"
        echo "Done."
