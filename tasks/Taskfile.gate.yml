# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Legacy shared Gate box in Hetzner Cloud project Gate. Unmanaged until
# decommission (no provision tasks; server/IP/firewall via hcloud or console).
# Dev vpn box = vpn:provision:present|absent (Ansible).
#
# Secrets: ../secrets/gate.yml only for Hetzner + Fresh vpn_*.
version: '3'

vars:
  GATE_SECRETS: '{{.SECRETS_DIR}}/gate.yml'

tasks:
  ssh:allow:
    desc: "Allow current public IPv4 /32 (TCP/22) on gate-firewall"
    silent: true
    deps: [":_check:sops-key", ":_check:secrets", _check:gate-secrets]
    cmds:
      - bash ./scripts/ssh-allow.sh gate

  ssh:deny:
    desc: "Remove gate:ssh:allow travel rules from gate-firewall"
    silent: true
    deps: [":_check:sops-key", ":_check:secrets", _check:gate-secrets]
    cmds:
      - bash ./scripts/ssh-deny.sh gate

  configure:bootstrap:
    desc: "One-time bootstrap as root (after hostkeys:accept -- gate)"
    deps: [":_check:sops-key", ":_check:secrets", _check:gate-secrets]
    cmds:
      - task: :_ansible:bootstrap
        vars:
          PURPOSE: gate
          PLAYBOOK: playbooks/bootstrap.yml
          SECRETS_FILE: '{{.GATE_SECRETS}}'
          HCLOUD_SECRETS_SCRIPT: scripts/gate-secrets.sh

  configure:apply:
    desc: "Apply Gate config (base + Xray REALITY; Fresh vpn_* from gate.yml)"
    deps: [":_check:sops-key", ":_check:secrets", _check:gate-secrets]
    cmds:
      - task: :_ansible:run
        vars:
          PURPOSE: gate
          PLAYBOOK: playbooks/vpn.yml
          SECRETS_FILE: '{{.GATE_SECRETS}}'
          HCLOUD_SECRETS_SCRIPT: scripts/gate-secrets.sh

  _check:gate-secrets:
    desc: "(internal) Ensure secrets/gate.yml exists"
    internal: true
    silent: true
    deps: [":_check:secrets-dir"]
    preconditions:
      - sh: test -f "{{.GATE_SECRETS}}"
        msg: "Encrypted gate secrets missing: {{.GATE_SECRETS}}. Add gate.yml (project-Gate token + Fresh vpn_*)."
