# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Host identity helpers, parameterised by server purpose (platform | vpn).
#
# Naming:
#   platform: Hetzner server name "platform"; Ansible inventory "platform".
#   vpn:      Hetzner server name "vpn"; inventory "vpn".
#   SSH/Ansible always use the API IPv4 (no platform DNS name).
version: '3'

tasks:
  ip:
    desc: "Output API IPv4 for a box (use: task hostkeys:ip -- platform|vpn)"
    silent: true
    vars:
      PURPOSE:
        sh: echo "{{.CLI_ARGS}}" | awk '{print $1}'
    deps: [_check:purpose]
    cmds:
      - |
        case "{{.PURPOSE}}" in
          platform) SERVER_NAME="platform" ;;
          vpn)      SERVER_NAME="vpn" ;;
        esac
        IP=$(hcloud server ip "$SERVER_NAME") || {
          echo "No Hetzner server named $SERVER_NAME (not provisioned?)" >&2
          exit 1
        }
        echo "$IP"

  prepare:
    desc: "No-op (boxes have no DNS names; use: task hostkeys:prepare -- platform|vpn)"
    silent: true
    vars:
      PURPOSE:
        sh: echo "{{.CLI_ARGS}}" | awk '{print $1}'
    deps: [_check:purpose]
    cmds:
      - "true"

  accept:
    desc: "Accept a recreated box's host key by API IPv4 (use: task hostkeys:accept -- platform|vpn)"
    silent: true
    vars:
      PURPOSE:
        sh: echo "{{.CLI_ARGS}}" | awk '{print $1}'
    deps: [_check:purpose]
    cmds:
      - |
        IP=$(task hostkeys:ip -- "{{.PURPOSE}}") || exit 1
        ssh-keygen -R "$IP" -f "${HOME}/.ssh/known_hosts" -q 2>/dev/null || true
        echo "🔑 Accepting host key of ${IP} ({{.PURPOSE}})..."
        for user in ubuntu root; do
          if ssh -4 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o BatchMode=yes \
              "${user}@${IP}" "exit" 2>/dev/null; then
            echo "✅ Host key accepted (${user}@${IP})"
            exit 0
          fi
        done
        echo "❌ Could not SSH to ${IP} as ubuntu or root." >&2
        echo "   Away from home? Run: task ssh-allow-me" >&2
        exit 1

  _check:purpose:
    desc: "(internal) Validate CLI_ARGS: platform|vpn"
    internal: true
    silent: true
    preconditions:
      - sh: '[ -n "${BASE_DOMAIN:-}" ]'
        msg: "BASE_DOMAIN must be set by devcontainer (from base_domain in secrets)"
    cmds:
      - |
        PURPOSE=$(echo "{{.CLI_ARGS}}" | awk '{print $1}')
        case "$PURPOSE" in
          platform|vpn) ;;
          *)
            echo "Usage: -- platform|vpn" >&2; exit 1 ;;
        esac
