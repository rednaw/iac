# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Host identity helpers, parameterised by server purpose (platform | vpn | gate).
#
# Naming:
#   platform: Hetzner server name "platform"; Ansible inventory "platform".
#   vpn:      Hetzner server name "vpn"; inventory "vpn" (trip, Default project).
#   gate:     Hetzner server name "gate"; inventory "gate" (Cloud project Gate).
#   SSH/Ansible always use the API IPv4 (no platform DNS name).
#
# Purpose gate always loads HCLOUD_TOKEN from secrets/gate.yml (never ambient
# Default/Rednaw token).
version: '3'

tasks:
  ip:
    desc: "Output API IPv4 for a box (use: task hostkeys:ip -- platform|vpn|gate)"
    silent: true
    vars:
      PURPOSE:
        sh: echo "{{.CLI_ARGS}}" | awk '{print $1}'
    deps: [_check:purpose]
    cmds:
      - |
        set -euo pipefail
        PURPOSE="{{.PURPOSE}}"
        case "$PURPOSE" in
          platform) SERVER_NAME="platform" ;;
          vpn)      SERVER_NAME="vpn" ;;
          gate)     SERVER_NAME="gate" ;;
        esac
        if [ "$PURPOSE" = "gate" ]; then
          export SOPS_KEY_FILE="{{.SOPS_KEY_FILE}}"
          export SECRETS_DIR="{{.SECRETS_DIR}}"
          # shellcheck disable=SC1091
          . "./scripts/gate-tf-secrets.sh"
        fi
        IP=$(hcloud server ip "$SERVER_NAME") || {
          echo "No Hetzner server named $SERVER_NAME (not provisioned?)" >&2
          exit 1
        }
        echo "$IP"

  prepare:
    desc: "No-op (boxes have no DNS names; use: task hostkeys:prepare -- platform|vpn|gate)"
    silent: true
    vars:
      PURPOSE:
        sh: echo "{{.CLI_ARGS}}" | awk '{print $1}'
    deps: [_check:purpose]
    cmds:
      - "true"

  accept:
    desc: "Accept a recreated box's host key by API IPv4 (use: task hostkeys:accept -- platform|vpn|gate)"
    silent: true
    vars:
      PURPOSE:
        sh: echo "{{.CLI_ARGS}}" | awk '{print $1}'
      ACCEPT_MAX_ATTEMPTS: "24"
      ACCEPT_SLEEP_SECS: "5"
    deps: [_check:purpose]
    cmds:
      - |
        set -euo pipefail
        if [ "{{.PURPOSE}}" = "gate" ]; then
          export SOPS_KEY_FILE="{{.SOPS_KEY_FILE}}"
          export SECRETS_DIR="{{.SECRETS_DIR}}"
          # shellcheck disable=SC1091
          . "./scripts/gate-tf-secrets.sh"
        fi
        IP=$(task hostkeys:ip -- "{{.PURPOSE}}") || exit 1
        ssh-keygen -R "$IP" -f "${HOME}/.ssh/known_hosts" -q 2>/dev/null || true
        MAX="{{.ACCEPT_MAX_ATTEMPTS}}"
        SLEEP="{{.ACCEPT_SLEEP_SECS}}"
        echo "🔑 Accepting host key of ${IP} ({{.PURPOSE}})..."
        attempt=1
        while [ "$attempt" -le "$MAX" ]; do
          for user in ubuntu root; do
            if ssh -4 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o BatchMode=yes \
                "${user}@${IP}" "exit" 2>/dev/null; then
              echo "✅ Host key accepted (${user}@${IP})"
              exit 0
            fi
          done
          if [ "$attempt" -lt "$MAX" ]; then
            echo "   SSH not ready yet (attempt ${attempt}/${MAX}); retry in ${SLEEP}s…"
            sleep "$SLEEP"
          fi
          attempt=$((attempt + 1))
        done
        echo "❌ Could not SSH to ${IP} as ubuntu or root after ${MAX} attempts." >&2
        echo "   Away from home? Gate uses vpn_allowed_ssh_ips in gate.yml (world for first apply)." >&2
        exit 1

  _check:purpose:
    desc: "(internal) Validate CLI_ARGS: platform|vpn|gate"
    internal: true
    silent: true
    preconditions:
      - sh: '[ -n "${BASE_DOMAIN:-}" ]'
        msg: "BASE_DOMAIN must be set by devcontainer (from base_domain in secrets)"
    cmds:
      - |
        PURPOSE=$(echo "{{.CLI_ARGS}}" | awk '{print $1}')
        case "$PURPOSE" in
          platform|vpn|gate) ;;
          *)
            echo "Usage: -- platform|vpn|gate" >&2; exit 1 ;;
        esac
