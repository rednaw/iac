# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Public commands for the "platform" server purpose.
#
# Two phases (mirror the underlying tools):
#   provision:* — Terraform lifecycle (cloud server, firewall, DNS)
#   configure:* — Ansible lifecycle (what runs on the server)
#
# Thin wrappers over _terraform:* and _ansible:* internals; future server
# purposes (vpn, honeypot, ...) follow the same shape with different params.
#
# provision:* and configure:* have no env argument (single platform box).
#
# Do not put PURPOSE / SECRETS_SCRIPT / PLAYBOOK_* in include-level `vars:` —
# Task merges those into one scope and a later include (vpn) overwrites them.
version: '3'

vars:
  PLATFORM_TF_DIR: terraform/platform

tasks:
  provision:reconfigure:
    desc: "Reconfigure Terraform backend after org/project change"
    cmds:
      - task: :_terraform:reconfigure
        vars:
          TF_DIR: '{{.PLATFORM_TF_DIR}}'

  provision:plan:
    desc: "Plan provisioning changes"
    cmds:
      - task: :_terraform:plan
        vars:
          TF_DIR: '{{.PLATFORM_TF_DIR}}'
          SECRETS_SCRIPT: scripts/platform-tf-secrets.sh

  provision:apply:
    desc: "Apply provisioning changes"
    cmds:
      - task: :_terraform:apply
        vars:
          TF_DIR: '{{.PLATFORM_TF_DIR}}'
          PURPOSE: platform
          SECRETS_SCRIPT: scripts/platform-tf-secrets.sh

  provision:destroy:
    desc: "Destroy provisioned resources"
    cmds:
      - task: :_terraform:destroy
        vars:
          TF_DIR: '{{.PLATFORM_TF_DIR}}'
          PURPOSE: platform
          SECRETS_SCRIPT: scripts/platform-tf-secrets.sh

  provision:output:
    desc: "Show provisioning outputs"
    cmds:
      - task: :_terraform:output
        vars:
          TF_DIR: '{{.PLATFORM_TF_DIR}}'

  configure:bootstrap:
    desc: "One-time bootstrap as root"
    cmds:
      - task: :_ansible:bootstrap
        vars:
          PURPOSE: platform
          PLAYBOOK: playbooks/bootstrap.yml

  configure:apply:
    desc: "Apply server configuration"
    cmds:
      - task: :_ansible:run
        vars:
          PURPOSE: platform
          PLAYBOOK: playbooks/server.yml
