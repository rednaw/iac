# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Public commands for the "vpn" server purpose (dev REALITY box on Default).
# Secrets: ../secrets/vpn.yml only for Hetzner + vpn_*. TFC org still infra.yml.
#
# Burned IP (break-glass): provision:renew-ip
#   Primary renew = fullmoongate/vpn IssueOps.
# Wedged wipe: provision:destroy → provision:apply → hostkeys:accept →
#   configure:bootstrap → configure:apply → config.
version: '3'

vars:
  VPN_TF_DIR: terraform/vpn
  VPN_SECRETS: '{{.SECRETS_DIR}}/vpn.yml'

tasks:
  provision:reconfigure:
    desc: "Reconfigure Terraform backend after org/project change"
    cmds:
      - task: :_terraform:reconfigure
        vars:
          TF_DIR: '{{.VPN_TF_DIR}}'

  provision:plan:
    desc: "Plan VPN provisioning changes"
    deps: [":_check:sops-key", ":_check:secrets", _check:vpn-secrets]
    cmds:
      - task: :_terraform:plan
        vars:
          TF_DIR: '{{.VPN_TF_DIR}}'
          SECRETS_SCRIPT: scripts/vpn-tf-secrets.sh

  provision:apply:
    desc: "Apply VPN provisioning (creates managed primary IPv4 + server)"
    deps: [":_check:sops-key", ":_check:secrets", _check:vpn-secrets]
    cmds:
      - task: :_terraform:apply
        vars:
          TF_DIR: '{{.VPN_TF_DIR}}'
          PURPOSE: vpn
          SECRETS_SCRIPT: scripts/vpn-tf-secrets.sh

  provision:destroy:
    desc: "Destroy VPN primary IP + box + firewall (platform untouched)"
    deps: [":_check:sops-key", ":_check:secrets", _check:vpn-secrets]
    cmds:
      - task: :_terraform:destroy
        vars:
          TF_DIR: '{{.VPN_TF_DIR}}'
          PURPOSE: vpn
          SECRETS_SCRIPT: scripts/vpn-tf-secrets.sh

  provision:renew-ip:
    desc: "Break-glass burned IP (prefer fullmoongate/vpn IssueOps); then vpn:config"
    silent: true
    deps: [":_check:sops-key", ":_check:secrets", _check:vpn-secrets]
    cmds:
      # hcloud swap only — no TFC. State drifts until a later vpn:provision:apply.
      - |
        set -euo pipefail
        export SOPS_KEY_FILE="{{.SOPS_KEY_FILE}}"
        export SECRETS_DIR="{{.SECRETS_DIR}}"
        export SECRETS_VPN="{{.VPN_SECRETS}}"
        unset TF_WORKSPACE || true
        # shellcheck disable=SC1091
        . "./scripts/vpn-tf-secrets.sh"
        bash ./scripts/vpn-renew-ip.sh
      - task: config

  provision:output:
    desc: "Show VPN provisioning outputs (current IPv4)"
    cmds:
      - task: :_terraform:output
        vars:
          TF_DIR: '{{.VPN_TF_DIR}}'

  configure:bootstrap:
    desc: "One-time bootstrap as root (after wipe recreate + hostkeys:accept; not needed for renew-ip)"
    deps: [":_check:sops-key", ":_check:secrets", _check:vpn-secrets]
    cmds:
      - task: :_ansible:bootstrap
        vars:
          PURPOSE: vpn
          PLAYBOOK: playbooks/bootstrap.yml
          SECRETS_FILE: '{{.VPN_SECRETS}}'
          HCLOUD_SECRETS_SCRIPT: scripts/vpn-tf-secrets.sh

  configure:apply:
    desc: "Apply VPN server configuration (base hardening + Xray REALITY container)"
    deps: [":_check:sops-key", ":_check:secrets", _check:vpn-secrets]
    cmds:
      - task: :_ansible:run
        vars:
          PURPOSE: vpn
          PLAYBOOK: playbooks/vpn.yml
          SECRETS_FILE: '{{.VPN_SECRETS}}'
          HCLOUD_SECRETS_SCRIPT: scripts/vpn-tf-secrets.sh

  smoke:
    desc: "Hotel binary smoke (OneXray on): works? / renew? — exit 0 = OK"
    silent: true
    deps: [":_check:sops-key", ":_check:secrets", _check:vpn-secrets]
    cmds:
      - |
        # Dest from secrets (override with VPN_DEST=… if needed). Soft-fail if sops hiccups.
        if [ -z "${VPN_DEST:-}" ]; then
          VPN_DEST=$(SOPS_AGE_KEY_FILE="{{.SOPS_KEY_FILE}}" sops -d "{{.VPN_SECRETS}}" 2>/dev/null \
            | yq -r '.vpn_dest // ""' 2>/dev/null || true)
          export VPN_DEST
        fi
        bash scripts/vpn-china-smoke.sh

  config:
    desc: "Emit OneXray share link + QR from secrets and the current IPv4 (no SSH; does not install Xray)"
    silent: true
    deps: [":_check:sops-key", ":_check:secrets", _check:vpn-secrets]
    cmds:
      - |
        set -euo pipefail
        export SOPS_KEY_FILE="{{.SOPS_KEY_FILE}}"
        export SECRETS_DIR="{{.SECRETS_DIR}}"
        export SECRETS_VPN="{{.VPN_SECRETS}}"
        # shellcheck disable=SC1091
        . "./scripts/vpn-tf-secrets.sh"
        SECRETS=$(SOPS_AGE_KEY_FILE="{{.SOPS_KEY_FILE}}" sops -d "{{.VPN_SECRETS}}")
        UUID=$(echo "$SECRETS" | yq -r '.vpn_uuid // ""')
        PBK=$(echo "$SECRETS" | yq -r '.vpn_reality_public_key // ""')
        SID=$(echo "$SECRETS" | yq -r '.vpn_short_id // ""')
        DEST=$(echo "$SECRETS" | yq -r '.vpn_dest // ""')
        for pair in "vpn_uuid:$UUID" "vpn_reality_public_key:$PBK" "vpn_short_id:$SID" "vpn_dest:$DEST"; do
          if [ -z "${pair#*:}" ]; then
            echo "❌ ${pair%%:*} missing from {{.VPN_SECRETS}}" >&2
            exit 1
          fi
        done
        IP=$(task hostkeys:ip -- vpn) || exit 1
        LINK="vless://${UUID}@${IP}:443?type=tcp&security=reality&sni=${DEST}&fp=chrome&pbk=${PBK}&sid=${SID}&flow=xtls-rprx-vision#vpn-${DEST}"
        echo "OneXray share link (import on BOTH devices; address is the IPv4 on purpose):"
        echo ""
        echo "  ${LINK}"
        echo ""
        if command -v qrencode >/dev/null 2>&1; then
          qrencode -t ansiutf8 "${LINK}"
        else
          echo "(qrencode not installed — no QR; paste the link into OneXray on the Mac,"
          echo " then use OneXray's own QR display for the iPhone)"
        fi
        echo ""
        echo "⚠️  This link IS the credential (UUID + public key). Never share it."
        echo "   Client routing: geosite:cn → direct, everything else → this outbound; no geoip:cn."

  _check:vpn-secrets:
    desc: "(internal) Ensure secrets/vpn.yml exists"
    internal: true
    silent: true
    deps: [":_check:secrets-dir"]
    preconditions:
      - sh: test -f "{{.VPN_SECRETS}}"
        msg: "Encrypted vpn secrets missing: {{.VPN_SECRETS}}. Add vpn.yml (Default token mirror + vpn_*)."
