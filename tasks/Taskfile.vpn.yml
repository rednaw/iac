# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Public commands for the "vpn" server purpose (travel VPN, REALITY on 443).
# Design: docs/future/vpn-travel-china.md — manual: vpn-travel-china-manual.md
#
# No env argument anywhere: there is exactly one VPN box (workspace vpn-prod).
#
# Burned IP (default): provision:renew-ip → [travel: ssh-allow-me] →
#   hostkeys:accept -- vpn → [optional dest + configure:apply] → config.
# Wedged wipe: provision:destroy → provision:apply → hostkeys:accept →
#   configure:bootstrap → configure:apply → config.
version: '3'

vars:
  TF_DIR: terraform/vpn
  PURPOSE: vpn
  PREFIX: vpn
  WORKSPACE: prod
  SECRETS_SCRIPT: scripts/vpn-tf-secrets.sh
  PLAYBOOK_SERVER: playbooks/vpn.yml
  PLAYBOOK_BOOTSTRAP: playbooks/bootstrap.yml
  # Hetzner can hand back the same IPv4 after delete; renew retries replace.
  RENEW_IP_MAX_ATTEMPTS: "5"

tasks:
  provision:reconfigure:
    desc: "Reconfigure Terraform backend after org/project change (vpn-prod only)"
    cmds:
      - task: :_terraform:reconfigure
        vars:
          TF_DIR: '{{.TF_DIR}}'
          PREFIX: '{{.PREFIX}}'
          WORKSPACES: 'prod'

  provision:plan:
    desc: "Plan VPN provisioning changes"
    cmds:
      - task: :_terraform:plan
        vars:
          TF_DIR: '{{.TF_DIR}}'
          WORKSPACE: '{{.WORKSPACE}}'
          PREFIX: '{{.PREFIX}}'
          SECRETS_SCRIPT: '{{.SECRETS_SCRIPT}}'

  provision:apply:
    desc: "Apply VPN provisioning (creates managed primary IPv4 + server)"
    cmds:
      - task: :_terraform:apply
        vars:
          TF_DIR: '{{.TF_DIR}}'
          PURPOSE: '{{.PURPOSE}}'
          WORKSPACE: '{{.WORKSPACE}}'
          PREFIX: '{{.PREFIX}}'
          SECRETS_SCRIPT: '{{.SECRETS_SCRIPT}}'

  provision:destroy:
    desc: "Destroy VPN primary IP + box + firewall (platform untouched)"
    cmds:
      - task: :_terraform:destroy
        vars:
          TF_DIR: '{{.TF_DIR}}'
          PURPOSE: '{{.PURPOSE}}'
          WORKSPACE: '{{.WORKSPACE}}'
          PREFIX: '{{.PREFIX}}'
          SECRETS_SCRIPT: '{{.SECRETS_SCRIPT}}'

  provision:renew-ip:
    desc: "Burned IP: replace managed primary IPv4, keep disk; fail if address unchanged"
    silent: true
    deps: [":_check:sops-key"]
    cmds:
      - |
        set -euo pipefail
        TF_DIR="{{.TF_DIR}}"
        MAX="{{.RENEW_IP_MAX_ATTEMPTS}}"
        export SOPS_KEY_FILE="{{.SOPS_KEY_FILE}}"
        TFC_ORG=$(SOPS_AGE_KEY_FILE="{{.SOPS_KEY_FILE}}" sops -d secrets/infra.yml | yq -r '.terraform_cloud_organization')

        old_ip=$(task hostkeys:ip -- vpn) || {
          echo "❌ No VPN server to renew (provision first?)" >&2
          exit 1
        }
        echo "🔁 Burned IP renew: keep disk, replace primary IPv4 (current ${old_ip})"
        echo "   Max attempts: ${MAX} (Hetzner may recycle the same address)"
        echo ""

        # TF_WORKSPACE only for select/apply — never during init (remote prefix backends).
        unset TF_WORKSPACE || true
        terraform -chdir="$TF_DIR" init -backend-config="organization=${TFC_ORG}" >/dev/null
        terraform -chdir="$TF_DIR" workspace select "{{.WORKSPACE}}"
        export TF_WORKSPACE='{{.WORKSPACE}}'
        # shellcheck disable=SC1090
        . "./{{.SECRETS_SCRIPT}}"

        attempt=1
        while [ "$attempt" -le "$MAX" ]; do
          echo "—— attempt ${attempt}/${MAX}: terraform apply -replace=hcloud_primary_ip.v4 ——"
          terraform -chdir="$TF_DIR" apply -replace=hcloud_primary_ip.v4 -auto-approve
          new_ip=$(task hostkeys:ip -- vpn) || exit 1
          if [ "$new_ip" != "$old_ip" ]; then
            ssh-keygen -R "$old_ip" -f "${HOME}/.ssh/known_hosts" -q 2>/dev/null || true
            echo ""
            echo "✅ Primary IPv4 renewed: ${old_ip} → ${new_ip}"
            echo "   Next: task ssh-allow-me   # skip at home"
            echo "         task hostkeys:accept -- vpn"
            echo "         # optional dest step → task vpn:configure:apply"
            echo "         task vpn:config"
            exit 0
          fi
          echo "⚠️  Pool returned the same IPv4 (${new_ip}); retrying…" >&2
          attempt=$((attempt + 1))
        done
        echo "❌ Still on ${old_ip} after ${MAX} replaces. Wait and retry, or wipe (destroy/apply)." >&2
        exit 1

  provision:output:
    desc: "Show VPN provisioning outputs (current IPv4)"
    cmds:
      - task: :_terraform:output
        vars:
          TF_DIR: '{{.TF_DIR}}'
          WORKSPACE: '{{.WORKSPACE}}'
          PREFIX: '{{.PREFIX}}'

  configure:bootstrap:
    desc: "One-time bootstrap as root (after wipe recreate + hostkeys:accept; not needed for renew-ip)"
    cmds:
      - task: :_ansible:bootstrap
        vars:
          PURPOSE: '{{.PURPOSE}}'
          WORKSPACE: '{{.WORKSPACE}}'
          PLAYBOOK: '{{.PLAYBOOK_BOOTSTRAP}}'

  configure:apply:
    desc: "Apply VPN server configuration (base hardening + Xray REALITY container)"
    cmds:
      - task: :_ansible:run
        vars:
          PURPOSE: '{{.PURPOSE}}'
          WORKSPACE: '{{.WORKSPACE}}'
          PLAYBOOK: '{{.PLAYBOOK_SERVER}}'

  config:
    desc: "Emit OneXray share link + QR from secrets and the current IPv4 (no SSH; does not install Xray)"
    silent: true
    deps: [":_check:sops-key"]
    cmds:
      - |
        SECRETS=$(SOPS_AGE_KEY_FILE="{{.SOPS_KEY_FILE}}" sops -d secrets/infra.yml)
        UUID=$(echo "$SECRETS" | yq -r '.vpn_uuid // ""')
        PBK=$(echo "$SECRETS" | yq -r '.vpn_reality_public_key // ""')
        SID=$(echo "$SECRETS" | yq -r '.vpn_short_id // ""')
        DEST=$(echo "$SECRETS" | yq -r '.vpn_dest // ""')
        for pair in "vpn_uuid:$UUID" "vpn_reality_public_key:$PBK" "vpn_short_id:$SID" "vpn_dest:$DEST"; do
          if [ -z "${pair#*:}" ]; then
            echo "❌ ${pair%%:*} missing from secrets/infra.yml (see manual §2.1)" >&2
            exit 1
          fi
        done
        IP=$(task hostkeys:ip -- vpn) || exit 1
        LINK="vless://${UUID}@${IP}:443?type=tcp&security=reality&sni=${DEST}&fp=chrome&pbk=${PBK}&sid=${SID}&flow=xtls-rprx-vision#vpn-${DEST}"
        echo "OneXray share link (import on BOTH devices; address is the IPv4 on purpose):"
        echo ""
        echo "  ${LINK}"
        echo ""
        if command -v qrencode >/dev/null 2>&1; then
          qrencode -t ansiutf8 "${LINK}"
        else
          echo "(qrencode not installed — no QR; paste the link into OneXray on the Mac,"
          echo " then use OneXray's own QR display for the iPhone)"
        fi
        echo ""
        echo "⚠️  This link IS the credential (UUID + public key). Never share it."
        echo "   Client routing: geosite:cn → direct, everything else → this outbound; no geoip:cn."
